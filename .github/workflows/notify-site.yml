name: Notify site of content update

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger human-ai-cognition-lab.github.io rebuild
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.SITE_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/human-ai-cognition-lab/human-ai-cognition-lab.github.io/dispatches \
            -d '{"event_type":"research-book-updated"}'
